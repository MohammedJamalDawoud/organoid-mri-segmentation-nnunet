[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid-mri-segmentation-nnunet"
version = "0.2.0"
description = "MRI organoid segmentation workflow combining preprocessing, GMM probability modeling, QC, and nnU-Net integration helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.0",
  "scikit-image>=0.21",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.scripts]
mri-segmentation = "mri_segmentation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
